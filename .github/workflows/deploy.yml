name: Deploy Serverless API

on:
    push:
        branches:
            - main
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            # Secrets from GitHub
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            NODE_ENV: ${{ secrets.NODE_ENV }}
            DEV_SERVER_PORT: ${{ secrets.DEV_SERVER_PORT }}
            AWS_REGION: ${{ secrets.AWS_REGION }}

            # Determine stage based on branch
            STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        permissions:
            id-token: write
            contents: read

        steps:
            - name: 🧾 Checkout source
              uses: actions/checkout@v4

            - name: ⚙️ Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: 🌍 Install Serverless CLI globally
              run: npm install -g serverless@3.36.0

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🌍 Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: 🚀 Deploy to AWS with Serverless
              run: serverless deploy --stage $STAGE --region $AWS_REGION
